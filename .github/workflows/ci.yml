name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          directories=("nexilis" "tests")
          for dir in "${directories[@]}"; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name "*.cc" -o -name "*.hh" \) -exec clang-format -n -Werror {} +
            fi
          done

  cpp-tests:
    name: Run Native Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt-get install -y cmake g++ libgtest-dev libboost-all-dev

      - name: Build and run tests
        run: |
          cd tests/nexilis
          mkdir build
          cd build
          cmake ..
          make
          ./nexilis_tests

  c-tests:
    name: Run nexilisc Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt-get install -y cmake gcc libgtest-dev libboost-all-dev

      - name: Build and run C tests
        run: |
          cd tests/nexilisc
          mkdir build
          cd build
          cmake ..
          make
          ./nexilis_c_tests

  alias-check:
    name: Check Correct Alias Usage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run best_practices.py
        run: |
          pip install scripts/requirements.txt
          python3 scripts/create-env.py

          output=$(python3 scripts/best_practises.py)
          if [ "$output" = "0" ]; then
            echo "Best practices successful."
          else
            exit 1
          fi

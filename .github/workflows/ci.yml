name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          pip install -r scripts/requirements.txt
          python3 scripts/create_env.py
          python3 scripts/format.py

  cpp-tests:
    name: Run Native Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule sync --recursive && git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt-get install -y cmake g++ libgtest-dev libboost-all-dev

      - name: Build and run tests
        run: |
          cd tests/nexilis
          rm -rf build
          mkdir build
          cd build
          cmake ..
          make
          ./nexilis_tests

  c-tests:
    name: Run nexilisc Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Update submodules
        run: git submodule sync --recursive && git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt-get install -y cmake gcc libgtest-dev libboost-all-dev

      - name: Build and run C tests
        run: |
          cd tests/nexilisc
          rm -rf build
          mkdir build
          cd build
          cmake ..
          make
          ./nexilis_c_tests

  premake_tests:
    name: Run premake tests
    runs-on: ubuntu-24.04

    steps:
     - uses: actions/checkout@v3
       with:
        submodules: 'recursive'
        fetch-depth: 0

     - name: Update submodules
       run: git submodule sync --recursive && git submodule update --init --recursive

     - name: Install premake5
       uses: Jarod42/install-premake5@v5

     - name: Run run_premake.py
       run: |
          pip install -r scripts/requirements.txt
          python3 scripts/create_env.py
          python3 scripts/run_premake.py

  alias-check:
    name: Check Correct Alias Usage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run best_practices.py
        run: |
          pip install -r scripts/requirements.txt
          python3 scripts/create_env.py

          output=$(python3 scripts/best_practises.py)
          if [ "$output" = "0" ]; then
            echo "Best practices successful."
          else
            exit 1
          fi

name: Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        directories=("nexilis" "tests")
        for dir in "${directories[@]}"; do
          if [ -d "$dir" ]; then
            find "$dir" -type f \( -name "*.cc" -o -name "*.hh" \) -exec clang-format -n -Werror {} +
          fi
        done
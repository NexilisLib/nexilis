name: Run Googletest Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run:
        sudo apt update && sudo apt-get install -y cmake g++ libgtest-dev libboost-all-dev

    - name: Build and run tests
      run: |
        cd tests/nexilis
        mkdir build
        cd build
        cmake ..
        make
        ./nexilis_tests

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Nexilis_scripting"
version = "0.0.1"
description = "Collection of scripts for nexilis CI and more."
authors = [
  { name = "Valtteri Viirret", email = "viirretvaltteri@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [ "dotenv" ]

[project.optional-dependencies]
dev = [
  "flake8>=5.0",
]
